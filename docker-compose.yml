version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DATABASE_URL=sqlite:///./tree_analysis.db
      - MONGODB_URI=${MONGODB_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DETECTION_URL=http://ai-model:5000
      - EPICOLLECT_PROJECT_SLUG=${EPICOLLECT_PROJECT_SLUG:-vanjeevan}
      - EPICOLLECT_CLIENT_ID=${EPICOLLECT_CLIENT_ID:-8217}
      - EPICOLLECT_CLIENT_SECRET=${EPICOLLECT_CLIENT_SECRET}
    depends_on:
      - ai-model
    restart: unless-stopped

  ai-model:
    build:
      context: ./backend/species_detection
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      - ./backend/models:/app/models:ro
    restart: unless-stopped
