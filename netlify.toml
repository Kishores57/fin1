# ==============================================================================
# Netlify Configuration for Tree Analysis Platform
# ==============================================================================

[build]
  base    = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA routing fallback: redirect all requests to index.html with HTTP 200
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
